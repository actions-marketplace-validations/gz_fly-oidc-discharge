# Which GitHub Actions identities may discharge which Fly.io credential.
#
# One credential is one Fly token. A ticket carries no name, so the shared
# secret that opens it is what selects the credential: a staging job holding
# the staging caveated token cannot reach the prod credential's rules at all.
# Give every credential its own secret.
#
# A job passes when every claim of one rule of that credential matches.
# `*` matches any run of characters, including `/`.
# Every rule must pin repository, repository_owner, sub, or job_workflow_ref.
# Pin the caller (repository) as well as the workflow (job_workflow_ref):
# job_workflow_ref names the workflow file, and a job in another repository
# that calls it as a reusable workflow carries the same value.
# Claim reference: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect#understanding-the-oidc-token

default_discharge_ttl: 15m

credentials:
  # Gated on the deployment environment. `environment` alone proves nothing,
  # because any workflow in the repository can name any environment, so the
  # workflow file and its ref are pinned too. `repository` bounds the caller,
  # which job_workflow_ref does not do on its own.
  - name: prod
    shared_secret_env: SHARED_SECRET_PROD
    discharge_ttl: 10m
    rules:
      - name: prod deploy
        claims:
          repository: acme/web
          job_workflow_ref: acme/web/.github/workflows/deploy.yml@refs/heads/main
          environment: prod

  - name: staging
    shared_secret_env: SHARED_SECRET_STAGING
    rules:
      - name: staging deploy
        claims:
          repository: acme/web
          job_workflow_ref: acme/web/.github/workflows/deploy.yml@refs/heads/main
          environment: staging

  # Gated on the branch instead, for a credential with no environment of its
  # own. Any job on these refs may discharge it, including one that declares an
  # environment, so keep this credential's Fly token the least privileged.
  - name: ci
    shared_secret_env: SHARED_SECRET_CI
    rules:
      - name: main
        claims:
          repository: acme/web
          ref: refs/heads/main
      - name: merge queue
        claims:
          repository: acme/web
          event_name: merge_group
          ref: refs/heads/gh-readonly-queue/main/*
