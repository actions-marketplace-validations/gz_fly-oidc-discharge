# Private by default: no public IP, reachable only inside the Fly organization's
# network as http://<app>.flycast. Create it with `fly launch --flycast`, or for
# an existing app `fly ips allocate-v6 --private` and release the public ones.
# See the README for the two ways to get TLS.
app = "fly-oidc-discharge"
primary_region = "sjc"

[build]
  # image = "ghcr.io/gz/fly-oidc-discharge:v1"

[env]
  # Must match `fly tokens 3p add --location` and the action's `location` input.
  OIDC_DISCHARGE_LOCATION = "http://fly-oidc-discharge.flycast"
  POLICY_FILE = "/etc/fly-oidc-discharge/policy.yaml"

# The policy travels with `fly deploy`, so no volume and no rebuild is needed.
[[files]]
  guest_path = "/etc/fly-oidc-discharge/policy.yaml"
  local_path = "policy.yaml"

# Every credential's shared secret is a Fly secret named by the policy:
#   fly secrets set SHARED_SECRET_PROD=... SHARED_SECRET_STAGING=...

[http_service]
  internal_port = 8080
  # Flycast serves plain HTTP. With a public IP, set this true and Fly
  # terminates TLS with a certificate it issues and renews.
  force_https = false
  # Idle costs nothing: Fly Proxy stops the machine when no request is in
  # flight and starts it again on the next one.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250

# To terminate TLS in the service instead, so the certificate never leaves this
# app, set TLS_CERT and TLS_PRIVATE_KEY as secrets and replace [http_service]
# with a passthrough service. Fly Proxy then forwards TCP untouched, and
# autostart still works because the connection goes through the proxy:
#
#   [[services]]
#     internal_port = 8080
#     protocol = "tcp"
#     auto_stop_machines = "stop"
#     auto_start_machines = true
#     min_machines_running = 0
#
#     [[services.ports]]
#       port = 443
#       handlers = []   # no "tls" handler: this service holds the certificate
#
#     [[services.http_checks]]
#       interval = "15s"
#       timeout = "2s"
#       grace_period = "5s"
#       method = "get"
#       path = "/healthz"
#       protocol = "https"
#       tls_skip_verify = false
#       tls_server_name = "discharge.example.com"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
