# Private by default: no public IP, reachable only inside the Fly organization's
# network. Create it with `fly launch --flycast`, or for an existing app
# `fly ips allocate-v6 --private` and release the public ones.
app = "fly-oidc-discharge"
primary_region = "sjc"

[build]
  # image = "ghcr.io/gz/fly-oidc-discharge:v1"

[env]
  # Must match `fly tokens 3p add --location` and the action's `location` input,
  # and must be a name the certificate covers.
  OIDC_DISCHARGE_LOCATION = "https://discharge.example.com"
  POLICY_FILE = "/etc/fly-oidc-discharge/policy.yaml"

# The policy travels with `fly deploy`, so no volume and no rebuild is needed.
[[files]]
  guest_path = "/etc/fly-oidc-discharge/policy.yaml"
  local_path = "policy.yaml"

# Secrets this app expects:
#   fly secrets set TLS_CERT="$(cat fullchain.pem)" TLS_PRIVATE_KEY="$(cat privkey.pem)"
#   fly secrets set SHARED_SECRET_PROD=... SHARED_SECRET_STAGING=...

# Flycast is HTTP-only, so Fly Proxy cannot terminate TLS on a private address.
# The service holds the certificate instead and Fly forwards TCP untouched.
# Requests still pass through Fly Proxy, which is what starts a stopped machine.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  # Idle costs nothing: the machine stops when no request is in flight and
  # starts again on the next one.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = [] # no "tls" handler: this service holds the certificate

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/healthz"
    protocol = "https"
    tls_skip_verify = false
    tls_server_name = "discharge.example.com"

# For a public deployment, let Fly terminate TLS instead and leave TLS_CERT
# unset. Replace the service block above with:
#
#   [http_service]
#     internal_port = 8080
#     force_https = true
#     auto_stop_machines = "stop"
#     auto_start_machines = true
#     min_machines_running = 0
#
#     [[http_service.checks]]
#       interval = "15s"
#       timeout = "2s"
#       grace_period = "5s"
#       method = "GET"
#       path = "/healthz"
#
# then `fly ips allocate-v4 --shared`, `fly ips allocate-v6`, and set
# OIDC_DISCHARGE_LOCATION to https://<app>.fly.dev or a domain from `fly certs add`.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
